<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#E8DCC8">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="description" content="Shelby — Order your coffee and bites in seconds">
  <link rel="manifest" href="/manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <title>Shelby</title>
  <!-- Inline critical CSS for instant paint -->
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body { 
      background-color: #E8DCC8;
      background-image:
        repeating-linear-gradient(47deg, transparent 0px, transparent 1px, rgba(100,65,20,0.022) 1px, rgba(100,65,20,0.022) 2px),
        repeating-linear-gradient(-43deg, transparent 0px, transparent 1px, rgba(80,48,15,0.015) 1px, rgba(80,48,15,0.015) 2px),
        radial-gradient(ellipse at 12% 18%, rgba(255,248,225,0.60) 0%, transparent 46%),
        radial-gradient(ellipse at 88% 82%, rgba(188,158,118,0.32) 0%, transparent 46%),
        radial-gradient(ellipse at 50% 50%, transparent 38%, rgba(140,108,68,0.22) 100%);
      font-family: 'Inter', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
    }
    #app { height: 100%; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
